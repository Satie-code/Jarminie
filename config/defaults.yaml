# JARMINEI default configuration — checked into git, never edited by the app itself.
# Machine-specific overrides go in config/local.yaml (gitignored) instead;
# see docs/sprint_book/sprint_1_2.md for the override precedence.

voice:
  # "hey_jarvis" is openWakeWord's shipped pretrained stand-in for the
  # product's intended "hey jarminei" phrase, which has no pretrained
  # model yet (needs custom offline training) — see
  # backlog/technical_debt.md item 5.
  wake_phrases:
    - "hey_jarvis"
  # Real speaker IDs from models.tts_model (tts_models/en/vctk/vits),
  # user-confirmed by ear 2026-07-17 — see backlog/technical_debt.md item 7.
  jarvis_voice_id: "p340"
  minie_voice_id: "p243"
  # Sprint 2.11 — Persona Switching's Explicit Selection input.
  jarvis_trigger_phrases:
    - "talk to jarvis"
    - "switch to jarvis"
  # Includes "my knee"/"minnie" mishearing variants — see
  # backlog/technical_debt.md item 12.
  minie_trigger_phrases:
    - "talk to minie"
    - "switch to minie"
    - "talk to minnie"
    - "switch to minnie"
    - "talk to my knee"
    - "switch to my knee"
  mic_device_index: null
  mic_sample_rate_hz: 16000
  wake_word_sensitivity: 0.5
  # Sprint 2.5 — Voice Session Manager. session_timeout_seconds is the
  # inter-turn inactivity window; the other three govern intra-utterance
  # silence detection (utterance boundary) — see
  # docs/sprint_book/sprint_2_5.md's Engineering Decisions.
  session_timeout_seconds: 30.0
  utterance_silence_ms: 700.0
  utterance_silence_threshold: 0.02
  max_utterance_seconds: 30.0

resources:
  cpu_warning_percent: 70.0
  cpu_critical_percent: 90.0
  ram_warning_percent: 75.0
  ram_critical_percent: 90.0
  battery_warning_percent: 20.0
  battery_critical_percent: 10.0
  disk_warning_percent: 85.0
  disk_critical_percent: 95.0

database:
  sqlite_path: "database/jarminei.db"
  chroma_path: "database/chroma"
  # Sprint 2.7 — Conversation Session Store's rolling-log retention window.
  conversation_retention_days: 30

memory:
  # Sprint 3.1 — Memory Store Foundation. Namespaces every MemoryType's
  # ChromaDB collection under database.chroma_path.
  chroma_collection_prefix: "jarminei_memory"
  # Sprint 3.4 — Short-Term Memory. Starting score for a promoted memory
  # (mid-range of the Dynamic Memory Formula's 0-29 "Temporary" band);
  # crude keyword heuristic for what's worth remembering, a placeholder
  # until Sprint 3.8's real Context Analysis exists.
  short_term_default_confidence: 15.0
  short_term_salience_triggers:
    - "remind me"
    - "don't forget"
    - "note that"
    - "remember that"
  # Sprint 3.5 — Confidence Scoring Engine. Dynamic Memory Formula weights
  # (must sum to 1.0); importance_weight has no term in the normal scoring
  # formula (Importance's only signal is the User Override short-circuit
  # below) — see config/schema.py's MemoryConfig docstring.
  frequency_weight: 0.25
  recency_weight: 0.25
  recency_half_life_days: 14.0
  importance_weight: 0.2
  category_weight: 0.15
  category_importance:
    project: 0.9
    goal: 0.9
    routine: 0.6
    preference: 0.7
  category_default_weight: 0.5
  # Applied against a fixed neutral placeholder value until Sprint 5.2
  # (Emotion Inference) exists.
  emotional_weight: 0.15
  # User Override Rule triggers — matched case-insensitively as plain
  # substrings, no NLU.
  override_trigger_phrases:
    - "remember this"
    - "never forget this"
    - "this is important"
  # Sprint 3.6 — Memory Lifecycle Manager.
  cleanup_grace_period_days: 7
  monthly_review_min_band_days: 30
  # Sprint 3.9 — Memory Retrieval Engine. Must sum to 1.0.
  retrieval_similarity_weight: 0.6
  retrieval_confidence_weight: 0.4
  max_retrieval_results: 5

models:
  ollama_model: "gemma3"
  ollama_host: "http://localhost:11434"
  # Real-hardware latency is unverified (Sprint 3.7's own flagged risk) —
  # 10s is a starting guess; IntentDetector always degrades to UNKNOWN
  # rather than blocking a conversation turn if this is too short.
  ollama_timeout_seconds: 10.0
  whisper_model: "base"
  # Whisper's own no-speech skip can be overridden by a confident-looking
  # hallucinated segment; WhisperSpeechToText applies this threshold
  # itself, unconditionally — see backlog/technical_debt.md item 9.
  whisper_no_speech_threshold: 0.6
  # Biases transcription toward JARMINEI's own vocabulary — without this,
  # "talk to minie" was misheard as "talk to my knee" — see
  # backlog/technical_debt.md item 12.
  whisper_initial_prompt: "Jarvis and Minie are JARMINEI's two personas."
  tts_model: "tts_models/en/vctk/vits"

logging:
  level: "INFO"
  log_dir: "logs"
  max_bytes: 5000000
  backup_count: 3

ui:
  status_refresh_interval_ms: 3000
