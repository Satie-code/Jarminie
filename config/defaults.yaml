# JARMINEI default configuration — checked into git, never edited by the app itself.
# Machine-specific overrides go in config/local.yaml (gitignored) instead;
# see docs/sprint_book/sprint_1_2.md for the override precedence.

voice:
  # "hey_jarvis" is openWakeWord's shipped pretrained stand-in for the
  # product's intended "hey jarminei" phrase, which has no pretrained
  # model yet (needs custom offline training) — see
  # backlog/technical_debt.md item 5.
  wake_phrases:
    - "hey_jarvis"
  # Real speaker IDs from models.tts_model (tts_models/en/vctk/vits),
  # user-confirmed by ear 2026-07-17 — see backlog/technical_debt.md item 7.
  jarvis_voice_id: "p340"
  minie_voice_id: "p243"
  # Sprint 2.11 — Persona Switching's Explicit Selection input. Each
  # list includes the bare persona name itself ("jarvis"/"minie") as a
  # short-form trigger, not just full phrases like "talk to jarvis" —
  # added 2026-07-20 at the user's explicit request.
  jarvis_trigger_phrases:
    - "jarvis"
    - "talk to jarvis"
    - "switch to jarvis"
  # Includes "my knee"/"minnie" mishearing variants — see
  # backlog/technical_debt.md item 12.
  minie_trigger_phrases:
    - "minie"
    - "talk to minie"
    - "switch to minie"
    - "talk to minnie"
    - "switch to minnie"
    - "talk to my knee"
    - "switch to my knee"
  mic_device_index: null
  mic_sample_rate_hz: 16000
  wake_word_sensitivity: 0.5
  # Sprint 2.5 — Voice Session Manager. session_timeout_seconds is the
  # inter-turn inactivity window; the other three govern intra-utterance
  # silence detection (utterance boundary) — see
  # docs/sprint_book/sprint_2_5.md's Engineering Decisions.
  session_timeout_seconds: 30.0
  utterance_silence_ms: 700.0
  utterance_silence_threshold: 0.02
  max_utterance_seconds: 30.0

resources:
  cpu_warning_percent: 70.0
  cpu_critical_percent: 90.0
  ram_warning_percent: 75.0
  ram_critical_percent: 90.0
  battery_warning_percent: 20.0
  battery_critical_percent: 10.0
  disk_warning_percent: 85.0
  disk_critical_percent: 95.0

database:
  sqlite_path: "database/jarminei.db"
  chroma_path: "database/chroma"
  # Sprint 2.7 — Conversation Session Store's rolling-log retention window.
  conversation_retention_days: 30

memory:
  # Sprint 3.1 — Memory Store Foundation. Namespaces every MemoryType's
  # ChromaDB collection under database.chroma_path.
  chroma_collection_prefix: "jarminei_memory"
  # Sprint 3.4 — Short-Term Memory. Starting score for a promoted memory
  # (mid-range of the Dynamic Memory Formula's 0-29 "Temporary" band);
  # crude keyword heuristic for what's worth remembering, a placeholder
  # until Sprint 3.8's real Context Analysis exists.
  short_term_default_confidence: 15.0
  short_term_salience_triggers:
    - "remind me"
    - "don't forget"
    - "note that"
    - "remember that"
  # Sprint 3.5 — Confidence Scoring Engine. Dynamic Memory Formula weights
  # (must sum to 1.0); importance_weight has no term in the normal scoring
  # formula (Importance's only signal is the User Override short-circuit
  # below) — see config/schema.py's MemoryConfig docstring.
  frequency_weight: 0.25
  recency_weight: 0.25
  recency_half_life_days: 14.0
  importance_weight: 0.2
  category_weight: 0.15
  category_importance:
    project: 0.9
    goal: 0.9
    routine: 0.6
    preference: 0.7
  category_default_weight: 0.5
  # Applied against a real, derived signal (MemoryRecord.emotional_
  # significance) as of Sprint 5.3 — Emotional Memory.
  emotional_weight: 0.15
  # User Override Rule triggers — matched case-insensitively as plain
  # substrings, no NLU.
  override_trigger_phrases:
    - "remember this"
    - "never forget this"
    - "this is important"
  # Sprint 3.6 — Memory Lifecycle Manager.
  cleanup_grace_period_days: 7
  monthly_review_min_band_days: 30
  # Sprint 3.9 — Memory Retrieval Engine. Must sum to 1.0.
  retrieval_similarity_weight: 0.6
  retrieval_confidence_weight: 0.4
  max_retrieval_results: 5
  # Sprint 5.3 — Emotional Memory. Minimum emotional_significance a
  # record must meet for EmotionalMemory.recall_recent_moments() to
  # surface it.
  emotional_moment_recall_threshold: 0.6

models:
  # Changed from "gemma3" to "llama3" during Sprint 3.14 — "gemma3" was
  # never actually pulled on this project's own development machine, only
  # "llama3:latest" was; user-confirmed after Sprint 3.14's real-model
  # verification pass confirmed llama3 classifies correctly. See
  # docs/backlog/technical_debt.md item 16 and config/schema.py's
  # ModelConfig docstring.
  ollama_model: "llama3"
  ollama_host: "http://localhost:11434"
  # Real-hardware latency is unverified (Sprint 3.7's own flagged risk) —
  # 10s is a starting guess; IntentDetector always degrades to UNKNOWN
  # rather than blocking a conversation turn if this is too short.
  ollama_timeout_seconds: 10.0
  whisper_model: "base"
  # Whisper's own no-speech skip can be overridden by a confident-looking
  # hallucinated segment; WhisperSpeechToText applies this threshold
  # itself, unconditionally — see backlog/technical_debt.md item 9.
  whisper_no_speech_threshold: 0.6
  # Biases transcription toward JARMINEI's own vocabulary — without this,
  # "talk to minie" was misheard as "talk to my knee" — see
  # backlog/technical_debt.md item 12.
  whisper_initial_prompt: "Jarvis and Minie are JARMINEI's two personas."
  tts_model: "tts_models/en/vctk/vits"

logging:
  level: "INFO"
  log_dir: "logs"
  max_bytes: 5000000
  backup_count: 3

ui:
  status_refresh_interval_ms: 3000

device_control:
  # Sprint 4.2 — Application Manager. null means no allowlist
  # restriction. Enforced by security/permission_gate.py from Sprint
  # 4.7 onward — see config/schema.py's DeviceControlConfig docstring.
  application_allowlist: null
  max_tracked_applications: 50
  # Sprint 4.3 — File & Folder Operations. allowed_file_roots is
  # deliberately NOT set here: this file is checked into git and shared
  # across every installation, so a real per-machine default (the
  # current user's Documents/Desktop/Downloads via Path.home()) is
  # computed instead — see config/schema.py's
  # DeviceControlConfig._default_allowed_file_roots. Override in
  # config/local.yaml (gitignored) to restrict further.
  use_recycle_bin_for_delete: true
  # Sprint 4.4 — Window Management.
  window_operation_timeout_seconds: 5.0
  # Sprint 4.5 — Command Execution Engine. Default-deny allowlist,
  # deliberately empty: this executor (and, from Sprint 4.7 onward,
  # PermissionGate itself) is fully inert until deliberately populated
  # — see config/schema.py's DeviceControlConfig docstring. Still
  # deliberately empty as of Sprint 4.7.
  approved_commands: []
  command_timeout_seconds: 30.0
  # Sprint 4.6 — System Monitoring & Resource Protection (Action-Aware).
  # Only executors with genuine resource-consumption risk are gated by
  # default; file/window operations are cheap enough to exempt.
  resource_gate_action_types:
    - "launch_application"
    - "system_command"
  # Sprint 4.8 — Action Logging & Recovery.
  audit_log_retention_days: 90
  max_retry_attempts: 2
  # Sprint 4.12 — Error Handling & Recovery Hardening. A short, bounded
  # post-launch liveness check — see config/schema.py's DeviceControlConfig
  # docstring.
  application_launch_readiness_check_seconds: 0.5

security:
  # Sprint 4.7 — Permission & Confirmation System. Empty: every
  # ActionType uses PermissionPolicyEngine's own built-in RiskLevel
  # defaults (see security/policy_engine.py) unless overridden here,
  # keyed by ActionType.value -> "low"/"medium"/"high".
  risk_policies: {}
  confirmation_timeout_seconds: 20.0
  # Always DENY, no confirmation offered at all — empty by default, same
  # "present for future use, no real entry without explicit review"
  # discipline as AuthorityEvaluator.approved_emergency_procedures.
  hard_denylist: []

workflow:
  # Sprint 4.9 — Workflow Builder. A defensive, unvalidated bound — see
  # config/schema.py's WorkflowConfig docstring.
  max_steps_per_workflow: 20
  # Sprint 4.10 — Workflow Executor. Part 2's own "large workflow rule":
  # a workflow at or above this step count, or containing any HIGH-risk
  # step, triggers one whole-workflow confirmation prompt before any
  # step runs.
  large_workflow_step_threshold: 5
  large_workflow_confirmation_prompt_template: >-
    This workflow '{name}' will run {step_count} actions, including
    {high_risk_count} higher-risk steps. Should I proceed?

scheduler:
  # Sprint 4.14 — Calendar & Deadlines Store. A defensive, unvalidated
  # bound against an unbounded future-dated query — see
  # config/schema.py's SchedulerConfig docstring.
  max_lookahead_days: 365
  # Sprint 4.15 — Reminder Engine. How often the background poll checks
  # CalendarStore for newly-due items, and how far ahead of that check
  # "due" looks into the future.
  poll_interval_seconds: 30.0
  reminder_lookahead_seconds: 0.0
  # Sprint 4.18 — Scheduler & Internet Agent Integration. Recurring
  # cadence for background maintenance passes (memory lifecycle,
  # conversation/audit-log purges) — deliberately much longer than
  # poll_interval_seconds.
  maintenance_interval_seconds: 3600.0

internet:
  # 2026-08-01 Post-Sprint Revision — provider-agnostic refactor;
  # extended 2026-08-01 "Runtime Stability & Internet Layer Refactor"
  # with a real multi-provider fallback chain. See internet/
  # search_provider_registry.py for the full list of registered
  # providers and config/schema.py's InternetConfig docstring for the
  # full reasoning. search_api_key/tavily_api_key/search_base_url are
  # deliberately NOT set here — supply search_api_key (Brave) /
  # tavily_api_key (Tavily) via the JARMINEI_INTERNET_SEARCH_API_KEY /
  # JARMINEI_INTERNET_TAVILY_API_KEY environment variables, never
  # committed to this file; search_base_url is a real, self-hosted (or
  # pre-vetted third-party) SearXNG instance URL — no default is shipped
  # here on this project's own behalf (a real reliability/privacy
  # decision, not this project's own to make silently).
  #
  # search_providers is the real, live default behavior: main.py calls
  # create_search_provider_with_fallback(), which tries each name below
  # in order, moving to the next on any real failure — "no application
  # logic should depend on Brave specifically," a direct, explicit user
  # request. Each of tavily/searxng/brave is simply unusable (a missing
  # key/base_url) until configured above, which is exactly the intended
  # secure/inert-by-default shape — the chain degrades cleanly rather
  # than crashing either way. search_provider (below, singular) is kept
  # for backward compatibility only — it's what create_search_provider()
  # (the original, single-provider construction path) still uses, and
  # is what search_providers itself falls back to if ever cleared to [].
  search_providers:
    - "tavily"
    - "searxng"
    - "brave"
  search_provider: "brave"
  search_base_url: null
  max_results_per_query: 5
  request_timeout_seconds: 10.0
  # Sprint 4.17 — Summarization & Source Validation. null means "reuse
  # models.ollama_model."
  summarization_model: null
  min_sources_for_corroboration: 2

emotion:
  # Sprint 5.1 — Emotion Detection Engine (Level 5 Part A). A deliberately
  # crude, English-only, config-driven keyword heuristic — same "documented
  # starting point, correctable via config" discipline as voice's trigger
  # phrases. Keyed by EmotionLabel.value (emotion/models.py); UNKNOWN has
  # no entry by design (it's the fallback, never a match target).
  lexical_markers:
    happy: ["happy", "glad", "great news", "wonderful", "so good"]
    calm: ["calm", "relaxed", "at ease", "peaceful"]
    stressed: ["stressed", "overwhelmed", "so much pressure", "can't keep up", "anxious"]
    tired: ["tired", "exhausted", "sleepy", "worn out", "drained"]
    excited: ["excited", "can't wait", "thrilled", "pumped"]
    frustrated: ["frustrated", "annoyed", "this is ridiculous", "fed up", "irritated"]
    confused: ["confused", "not sure", "don't understand", "i'm lost", "unclear"]
    curious: ["curious", "i wonder", "wonder if", "interested to know"]
    focused: ["focused", "in the zone", "concentrating", "deep work"]
  # Unvalidated numeric baselines, used only as tie-breakers among matched
  # lexical markers — see config/schema.py's EmotionConfig docstring.
  speaking_rate_baseline_wpm: 150.0
  long_pause_threshold_seconds: 4.0
  # EmotionDetectionEngine.estimate()'s confidence-weighting knobs.
  sentiment_hint_base_confidence: 0.65
  lexical_marker_agreement_bonus: 0.2
  lexical_only_base_confidence: 0.45
  numeric_tie_break_bonus: 0.1
  # Below this, estimate() discounts to EmotionLabel.UNKNOWN/0.0 rather
  # than assert a guess it isn't confident in.
  min_estimate_confidence: 0.35
  # Sprint 5.2 — Emotional State Manager. Bounded EMA smoothing weight —
  # small by default so EmotionalState evolves gradually, never
  # snapping to one turn's own read.
  state_smoothing_alpha: 0.15
  # Half-life (seconds) for decay_toward_baseline()'s pull back toward
  # each dimension's neutral midpoint. 1800s = 30 minutes.
  baseline_decay_half_life_seconds: 1800.0
  # Per-EmotionLabel.value target VALUES apply_estimate() pulls each named
  # dimension toward — a label's own entry names only the dimensions it
  # meaningfully moves; conversation_momentum is never driven from here
  # (see emotion/state_manager.py's own docstring). Real, disclosed,
  # unvalidated first-pass defaults.
  label_state_targets:
    happy: {mood: 60.0, comfort: 70.0}
    calm: {stress: 20.0, comfort: 65.0, energy: 40.0}
    stressed: {stress: 85.0, comfort: 25.0, mood: -30.0}
    tired: {energy: 15.0, focus: 30.0, mood: -10.0}
    excited: {energy: 85.0, mood: 55.0, social_energy: 75.0}
    frustrated: {stress: 75.0, mood: -45.0, comfort: 30.0}
    confused: {focus: 25.0, stress: 60.0}
    curious: {focus: 70.0, energy: 60.0, social_energy: 60.0}
    focused: {focus: 90.0, energy: 55.0}
  # Sprint 5.4 — Persona Behavioral Adaptation. personas/jarvis.py's/
  # personas/minie.py's own _select_tone_variant() thresholds. Real,
  # disclosed, unvalidated first-pass defaults, same category as
  # speaking_rate_baseline_wpm above. Stress is shared; mood/comfort are
  # per-persona (Minie's own looser thresholds lean into ENCOURAGING
  # more readily, matching her "casual, comfort, wellness" identity).
  tone_high_stress_threshold: 70.0
  jarvis_tone_low_mood_threshold: -25.0
  jarvis_tone_low_comfort_threshold: 35.0
  minie_tone_low_mood_threshold: -15.0
  minie_tone_low_comfort_threshold: 40.0

presentation:
  # Sprint 5.5 — Presentation State Engine (Level 5 Part A). Per-persona
  # output ranges presentation/jarvis_state_computer.py's/
  # presentation/minie_state_computer.py's own compute() scale an
  # EmotionalState reading into. Real, disclosed, unvalidated first-pass
  # numbers. Jarvis: narrow, low ranges (brief's locked "Minimal...
  # No flashy cyberpunk effects" identity). Minie: wide ranges (brief's
  # locked "Warm. Comforting. Expressive" identity).
  jarvis_smile_intensity_min: 0.0
  jarvis_smile_intensity_max: 0.05
  jarvis_eye_openness_min: 0.5
  jarvis_eye_openness_max: 0.7
  jarvis_voice_warmth_min: 0.2
  jarvis_voice_warmth_max: 0.4
  jarvis_animation_speed_min: 0.9
  jarvis_animation_speed_max: 1.2
  jarvis_particle_density_min: 0.0
  jarvis_particle_density_max: 0.05
  jarvis_gesture_probability_min: 0.05
  jarvis_gesture_probability_max: 0.2
  # Locked identity palette (brief: "Dark theme, Electric blue, Cyan
  # accents") — fixed, not emotion-driven; see PresentationConfig's own
  # docstring.
  jarvis_lighting_color: "#0A84FF"
  jarvis_ui_accent: "#22D3EE"
  # Sprint 5.7 — Jarvis Renderer. presentation/widgets/segmented_ring_widget.py's
  # own fixed arc-segment count; presentation/jarvis_renderer.py's own
  # QTimer interval (~30fps) driving the sphere/ring animation loop.
  jarvis_ring_segment_count: 12
  jarvis_animation_tick_ms: 33

  minie_smile_intensity_min: 0.15
  minie_smile_intensity_max: 0.95
  minie_eye_openness_min: 0.35
  minie_eye_openness_max: 1.0
  minie_voice_warmth_min: 0.4
  minie_voice_warmth_max: 1.0
  minie_animation_speed_min: 0.6
  minie_animation_speed_max: 1.6
  minie_particle_density_min: 0.1
  minie_particle_density_max: 0.75
  minie_gesture_probability_min: 0.15
  minie_gesture_probability_max: 0.65
  # Locked identity palette (brief: "Lavender, Warm white, Rose gold,
  # Soft teal") — fixed, not emotion-driven.
  minie_lighting_color: "#C8A8E9"
  minie_ui_accent: "#B76E79"

  # Sprint 5.8 — Minie Renderer & Avatar Renderer Interface. VTube Studio
  # is a separately-installed, separately-running external application
  # the user owns and configures independently — JARMINEI neither
  # embeds nor redistributes Live2D's own SDK, and does not itself
  # render Minie's avatar. See presentation/vtube_studio_renderer.py's
  # own module docstring.
  avatar_backend: "vtube_studio"
  vtube_studio_host: "localhost"
  vtube_studio_port: 8001
  vtube_studio_plugin_name: "JARMINEI"
  vtube_studio_plugin_developer: "JARMINEI Project"
  # A real secret (a VTube-Studio-issued plugin auth token), persisted
  # locally and never committed — see .gitignore and PresentationConfig's
  # own docstring for the full "why a file path, not an env var" reasoning.
  vtube_studio_auth_token_path: "config/vtube_studio_token.json"
  vtube_studio_connection_timeout_seconds: 5.0
  # PresentationState field name -> Live2D model parameter name. Real,
  # disclosed, unvalidated first-pass defaults — voice_warmth's default
  # is a placeholder custom-parameter name with no guaranteed effect;
  # see PresentationConfig's own docstring.
  vtube_studio_parameter_mapping:
    smile_intensity: "ParamMouthForm"
    eye_openness: "ParamEyeLOpen"
    voice_warmth: "ParamGlow"
  # presentation/minie_renderer.py's own _derive_expression_id() table:
  # expression_id -> minimum (smile_intensity + voice_warmth) / 2
  # "expressiveness" reading required, highest-threshold match wins.
  # Real, disclosed, unvalidated first-pass vocabulary — reconfigurable
  # to match whatever expressions the user's own Live2D model defines.
  minie_expression_thresholds:
    neutral: 0.0
    smile: 0.45
    big_smile: 0.75

  # Sprint 5.9 — Gesture Engine. GestureTrigger.value -> candidate
  # gesture_id strings presentation/gesture_engine.py's GestureEngine
  # round-robins through; shared across both personas (GestureEngine
  # itself holds no persona-specific logic — each renderer's own
  # trigger_gesture() decides how a given id renders). Real, disclosed,
  # unvalidated first-pass vocabulary, reconfigurable without a code
  # change. An empty/absent list for a trigger is a valid, honest no-op.
  gesture_vocabulary:
    notification:
      - "notification_glance"
      - "notification_pulse"
    turn_start:
      - "attentive_lean"
      - "focus_pulse"
    turn_end:
      - "settle"
      - "soft_nod"
    mode_transition_to_active:
      - "wake_pulse"
      - "brighten"
    mode_transition_to_dormant:
      - "dim_fade"
      - "settle"
    listening_posture:
      - "listening_tilt"
      - "listen_pulse"
    speaking_posture:
      - "speaking_bob"
      - "speak_pulse"
    ambient_idle:
      - "idle_glance"
      - "idle_blink"
      - "head_tilt"
  # How often GestureEngine.maybe_roll_ambient_gesture() can fire at
  # most, independent of PresentationState.gesture_probability itself.
  ambient_gesture_roll_interval_seconds: 15.0
  # presentation/jarvis_renderer.py's own trigger_gesture() accent-pulse
  # duration (in SegmentedRingWidget ticks) — config-driven rather than
  # a hardcoded constant.
  jarvis_gesture_pulse_ticks: 10

  # Sprint 5.10 — Persona Transition Engine. presentation/transition_engine.py's
  # own TransitionEngine.transition() timing — a whole-sequence budget and
  # the PARTICLE_TRANSITION phase's own hold duration. Real, disclosed,
  # unvalidated first-pass timing guesses.
  transition_max_duration_seconds: 2.5
  transition_particle_phase_seconds: 0.8

  # Sprint 5.11 — Voice Personality. presentation/voice_personality.py's
  # VoicePersonalityModulator.shape_pacing(). pacing_pause_marker is an
  # ellipsis — verified against the real installed coqui-tts (0.27.5)
  # text pipeline: there is no dedicated SSML pause token, only ordinary
  # punctuation the model's own tokenizer already treats as
  # pause-inducing (see PresentationConfig's own docstring).
  pacing_pause_marker: "..."
  pacing_low_warmth_pause_weight: 0.3
  pacing_high_warmth_pause_weight: 0.7
  # presentation/lip_sync.py's own LipSyncDriver RMS-amplitude sampling
  # window size.
  lip_sync_sample_window_ms: 50.0

  # Sprint 5.12 — Adaptive Workspace. presentation/adaptive_workspace.py's
  # AdaptiveWorkspaceController.select_profile() keyword vocabulary,
  # keyed by WorkspaceProfile.value. No "general" entry — GENERAL is the
  # safe-failure default, never matched into. Real, disclosed,
  # unvalidated first-pass vocabulary, reconfigurable without a code
  # change.
  workspace_profile_keywords:
    coding:
      - "code"
      - "coding"
      - "bug"
      - "debug"
      - "function"
      - "repository"
      - "compile"
      - "script"
    research:
      - "research"
      - "article"
      - "source"
      - "citation"
      - "paper"
      - "investigate"
    study:
      - "study"
      - "exam"
      - "homework"
      - "lecture"
      - "course"
      - "assignment"
    projects:
      - "project"
      - "deadline"
      - "milestone"
      - "roadmap"
      - "meeting"
      - "plan"
  # should_switch()'s own minimum consecutive-matching-turn count before
  # recommending an actual dashboard rearrangement.
  workspace_switch_debounce_turns: 2

  # Sprint 5.13 — Companion Experience. presentation/companion_experience.py's
  # CompanionExperienceEngine. greeting_idle_threshold_seconds: below this
  # much session idle time, no special "welcome back" moment is warranted
  # (3600.0 = one hour). celebration_significance_threshold is a
  # deliberately higher bar than memory.emotional_moment_recall_threshold
  # — reserved for genuinely standout moments, not merely recall-worthy
  # ones.
  greeting_idle_threshold_seconds: 3600.0
  celebration_significance_threshold: 0.75
